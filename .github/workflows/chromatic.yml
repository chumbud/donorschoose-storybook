name: Chromatic

# Publishes the Storybook to Chromatic so the public link stays current.
# - Push to main:   builds, publishes, and auto-accepts changes (updates the
#                    permanent public link).
# - Pull requests:  builds and publishes for visual review (not auto-accepted).
# - Manual:         run on demand from the Actions tab.
#
# Requires a repo secret named CHROMATIC_PROJECT_TOKEN
# (Chromatic → Manage → Configure → project token).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  chromatic:
    name: Publish to Chromatic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for Chromatic baselines)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
          # Don't fail the build just because snapshots changed…
          exitZeroOnChanges: true
          # …and on main, auto-accept so the published public link updates.
          autoAcceptChanges: main
